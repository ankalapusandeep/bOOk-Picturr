<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Scratch & Win - ShowPay</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>

    :root {
      --crimson: #c0392b;
      --crimson-glow: rgba(192,57,43,0.5);
      --gold: #f0c040;
      --deep: #07080f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #ddd8cc;
      --muted: rgba(221,216,204,0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--deep);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(192,57,43,0.08), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(240,192,64,0.06), transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(15,20,40,0.95), var(--deep) 100%);
    }

    .scratch-page {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 550px;

      text-align: center;
    }

    .scratch-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;

      backdrop-filter: blur(22px);

      box-shadow: 0 30px 80px rgba(0,0,0,0.55);

      padding: 3rem 2rem;

      position: relative;
      overflow: hidden;

      animation: fadeUp 0.9s ease both;
    }

    .scratch-box::before {
      content: '';

      position: absolute;
      inset: 0;

      background: linear-gradient(
        135deg,
        transparent,
        rgba(240,192,64,0.04),
        transparent
      );

      pointer-events: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .brand {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 3px;

      color: var(--gold);

      text-shadow: 0 0 20px rgba(240,192,64,0.5);

      margin-bottom: 1.6rem;
    }

    .brand-dot {
      color: var(--crimson);
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 5px;
      text-transform: uppercase;

      color: var(--crimson);

      margin-bottom: 0.8rem;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 2px;

      margin-bottom: 1rem;

      background: linear-gradient(
        135deg,
        #fff 0%,
        var(--gold) 55%,
        #c08020 100%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      position: relative;
      z-index: 2;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 2rem;

      position: relative;
      z-index: 2;
    }

    .section-rule {
      width: 55px;
      height: 1px;

      background: linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
      );

      margin: 1rem auto 2rem;
    }

    .scratch-container {
      width: 320px;
      height: 180px;

      margin: auto;

      border-radius: 18px;

      position: relative;
      overflow: hidden;

      background: linear-gradient(
        135deg,
        #FFD700,
        #FFA500
      );

      box-shadow:
        0 0 30px rgba(255,215,0,0.35),
        0 15px 40px rgba(0,0,0,0.5);

      animation: glow 2s infinite alternate;

      cursor: pointer;
    }

    @keyframes glow {
      from {
        box-shadow:
          0 0 10px rgba(255,215,0,0.3),
          0 10px 30px rgba(0,0,0,0.4);
      }

      to {
        box-shadow:
          0 0 35px rgba(255,215,0,0.8),
          0 20px 45px rgba(0,0,0,0.6);
      }
    }

    .vibrate {
      animation:
        glow 2s infinite alternate,
        vibrate 0.1s infinite;
    }

    @keyframes vibrate {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      20% { transform: translate(-1px, -2px) rotate(-1deg); }
      40% { transform: translate(-3px, 0px) rotate(1deg); }
      60% { transform: translate(3px, 2px) rotate(0deg); }
      80% { transform: translate(1px, -1px) rotate(1deg); }
      100% { transform: translate(-1px, 2px) rotate(-1deg); }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    #offerText {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      font-size: 1.5rem;
      font-weight: 700;

      color: #111;

      opacity: 0;

      transition: opacity 0.5s ease;

      z-index: 1;
    }

    .gift-text {
      margin-top: 1.4rem;

      color: var(--muted);

      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .ticket-btn {
      width: 100%;

      margin-top: 2rem;

      padding: 0.95rem 1.5rem;

      border: none;
      border-radius: 4px;

      background: linear-gradient(
        135deg,
        var(--crimson),
        #8b1a1a
      );

      color: #fff;

      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;

      transition: all 0.3s ease;

      position: relative;
      overflow: hidden;

      text-decoration: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ticket-btn::after {
      content: '';

      position: absolute;
      inset: 0;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.15),
        transparent
      );

      transform: translateX(-100%);
      transition: transform 0.45s;
    }

    .ticket-btn:hover::after {
      transform: translateX(100%);
    }

    .ticket-btn:hover {
      transform: translateY(-4px) scale(1.02);

      box-shadow: 0 10px 28px var(--crimson-glow);

      color: #fff;
    }

    .toast-box {
      position: fixed;

      bottom: 2rem;
      left: 50%;

      transform: translateX(-50%) translateY(20px);

      background: rgba(10,10,20,0.95);

      border: 1px solid rgba(255,255,255,0.08);

      color: #fff;

      padding: 0.95rem 1.8rem;

      border-radius: 6px;

      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;

      backdrop-filter: blur(16px);

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;

      z-index: 9999;

      text-align: center;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 576px) {

      .scratch-box {
        padding: 2.2rem 1.2rem;
      }

      .scratch-container {
        width: 100%;
        max-width: 320px;
      }

      canvas {
        width: 100%;
        height: 100%;
      }

      .toast-box {
        width: 90%;
        font-size: 0.7rem;
      }
    }

  </style>
</head>

<body>

<div class="toast-box" id="toast"></div>

<div class="scratch-page">

  <div class="scratch-box">

    <div class="brand">
      Show<span class="brand-dot">·</span>Pay
    </div>

    <p class="eyebrow">✦ Scratch & Win ✦</p>

    <h2 class="main-title">Congratulations!</h2>

    <p class="subtitle">
      Scratch the card to reveal your surprise
    </p>

    <div class="section-rule"></div>

    <div class="scratch-container vibrate" id="scratchCard">

      <canvas id="scratchCanvas" width="320" height="180"></canvas>

      <div id="offerText">
        🍿 Complimentary Gift
      </div>

    </div>

    <p class="gift-text">
      Tap or Scratch Anywhere
    </p>

    <a href="ticket.html" class="ticket-btn">
      View Ticket
    </a>

  </div>

</div>

<script>

  const canvas = document.getElementById("scratchCanvas");

  const ctx = canvas.getContext("2d");

  const offerText = document.getElementById("offerText");

  const scratchCard = document.getElementById("scratchCard");

  // Cover Layer

  ctx.fillStyle = "#FFD700";

  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.globalCompositeOperation = 'destination-out';

  let isDrawing = false;

  let unlocked = false;

  canvas.addEventListener("mousedown", () => isDrawing = true);

  canvas.addEventListener("mouseup", () => {
    isDrawing = false;
    checkReveal();
  });

  canvas.addEventListener("mousemove", scratch);

  canvas.addEventListener("touchstart", () => isDrawing = true);

  canvas.addEventListener("touchend", () => {
    isDrawing = false;
    checkReveal();
  });

  canvas.addEventListener("touchmove", scratch);

  function scratch(e) {

    if (!isDrawing || unlocked) return;

    e.preventDefault();

    let x, y;

    if (e.touches) {

      const rect = canvas.getBoundingClientRect();

      x = e.touches[0].clientX - rect.left;

      y = e.touches[0].clientY - rect.top;

    } else {

      x = e.offsetX;

      y = e.offsetY;
    }

    ctx.beginPath();

    ctx.arc(x, y, 20, 0, Math.PI * 2);

    ctx.fill();
  }

  function unlockCard() {

    if (unlocked) return;

    unlocked = true;

    offerText.style.opacity = 1;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    scratchCard.classList.remove("vibrate");

    showToast("Gift unlocked!", "success");

    confetti({
      particleCount: 200,
      spread: 100,
      origin: { y: 0.6 }
    });

    confetti({
      particleCount: 150,
      spread: 120,
      origin: { y: 0.6 }
    });
  }

  function checkReveal() {

    if (unlocked) return;

    const imageData = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

    let total = imageData.data.length / 4;

    let transparent = 0;

    for (let i = 3; i < imageData.data.length; i += 4) {

      if (imageData.data[i] === 0) {
        transparent++;
      }
    }

    let percent = (transparent / total) * 100;

    if (percent > 40) {
      unlockCard();
    }
  }

  scratchCard.addEventListener("click", unlockCard);

  let toastTimeout;

  function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;

    toast.className = "toast-box show";

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {

      toast.classList.remove("show");

    }, 2500);
  }

</script>

</body>
</html>
