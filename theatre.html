<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select Theatre - ShowPay</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --crimson: #c0392b;
      --crimson-glow: rgba(192,57,43,0.5);
      --gold: #f0c040;
      --deep: #07080f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #ddd8cc;
      --muted: rgba(221,216,204,0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--deep);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(192,57,43,0.08), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(240,192,64,0.06), transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(15,20,40,0.95), var(--deep) 100%);
    }

    /* NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7,8,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      animation: slideDown 0.7s ease both;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-100%);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .navbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold) !important;
      text-shadow: 0 0 20px rgba(240,192,64,0.5);
      text-decoration: none;
    }

    .navbar-brand:hover {
      text-shadow: 0 0 40px rgba(240,192,64,0.9);
    }

    .brand-dot {
      color: var(--crimson);
    }

    /* PAGE */
    .page-wrap {
      position: relative;
      z-index: 1;
      padding: 3rem 1rem 5rem;
    }

    /* BACK BUTTON */
    .back-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 0.55rem 1.2rem;
      border-radius: 3px;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: var(--crimson);
      border-color: var(--crimson);
      color: #fff;
      box-shadow: 0 0 18px var(--crimson-glow);
      transform: translateX(-4px);
    }

    /* MAIN CARD */
    .theatre-container {
      max-width: 720px;
      margin: 3rem auto 0;
      padding: 3rem 2rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      animation: fadeUp 0.9s ease both;
      position: relative;
      overflow: hidden;
    }

    .theatre-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        transparent,
        rgba(240,192,64,0.04),
        transparent
      );
      pointer-events: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 0.8rem;
      text-align: center;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 1rem;
      color: #fff;
    }

    #selectedMovie {
      background: linear-gradient(
        135deg,
        #fff 0%,
        var(--gold) 55%,
        #c08020 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .section-rule {
      width: 55px;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
      );
      margin: 1rem auto 2.5rem;
    }

    /* THEATRE BUTTONS */
    .theatre-btn {
      width: 100%;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .theatre-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.14),
        transparent
      );
      transform: translateX(-100%);
      transition: transform 0.45s;
    }

    .theatre-btn:hover::after {
      transform: translateX(100%);
    }

    .theatre-btn:hover {
      background: linear-gradient(
        135deg,
        var(--crimson),
        #8b1a1a
      );
      border-color: var(--crimson);
      color: #fff;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 28px var(--crimson-glow);
    }

    /* FOOTER */
    footer {
      position: relative;
      z-index: 1;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 576px) {
      .theatre-container {
        padding: 2.2rem 1.2rem;
      }

      .main-title {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      Show<span class="brand-dot">·</span>Pay
    </a>
  </div>
</nav>

<div class="page-wrap">

  <!-- BACK BUTTON -->
  <div class="container" id="backBtnContainer" style="display:none;">
    <button class="back-btn" onclick="history.back()">← Back</button>
  </div>

  <!-- THEATRE SELECTION -->
  <div class="theatre-container">

    <p class="eyebrow">✦ Premium Cinema Booking ✦</p>

    <h2 class="main-title">
      Select a Theatre for <br>
      <span id="selectedMovie"></span>
    </h2>

    <p class="subtitle">Choose Your Cinema Experience</p>

    <div class="section-rule"></div>

    <div class="d-grid gap-3">

      <button class="theatre-btn" onclick="selectTheatre('PVR')">
        🎬 PVR Cinemas
      </button>

      <button class="theatre-btn" onclick="selectTheatre('IMAX')">
        🍿 IMAX Theatre
      </button>

      <button class="theatre-btn" onclick="selectTheatre('AMB')">
        ✨ AMB Cinemas
      </button>

      <button class="theatre-btn" onclick="selectTheatre('Gokul')">
        🎥 Gokul Theatre
      </button>

      <button class="theatre-btn" onclick="selectTheatre('Sandhya')">
        🌟 Sandhya Theatre
      </button>

      <button class="theatre-btn" onclick="selectTheatre('AAA')">
        🔥 AAA Cinemas
      </button>

    </div>

  </div>
</div>

<footer>
  © 2025 ShowPay · Premium Cinema Experience
</footer>

<script>

  // Show back button
  if (!window.location.pathname.endsWith("index.html")) {
    document.getElementById("backBtnContainer").style.display = "block";
  }

  // Get selected movie
  const movie = localStorage.getItem("movieName") || "None";

  document.getElementById("selectedMovie").innerText = movie;

  // Select theatre
  function selectTheatre(theatre) {
    localStorage.setItem("theatre", theatre);
    window.location.href = "seats.html";
  }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
