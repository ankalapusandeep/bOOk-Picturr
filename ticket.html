<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Your Ticket - bOOk Picturr</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>

    :root {
      --crimson: #c0392b;
      --crimson-glow: rgba(192,57,43,0.5);
      --gold: #f0c040;
      --deep: #07080f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #ddd8cc;
      --muted: rgba(221,216,204,0.5);
      --green: #2ecc71;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--deep);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(192,57,43,0.08), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(240,192,64,0.06), transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(15,20,40,0.95), var(--deep) 100%);
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(7,8,15,0.9);

      backdrop-filter: blur(20px);

      border-bottom: 1px solid var(--border);

      padding: 0.9rem 1.5rem;
    }

    .navbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 3px;

      color: var(--gold) !important;

      text-decoration: none;

      text-shadow: 0 0 20px rgba(240,192,64,0.5);
    }

    .brand-dot {
      color: var(--crimson);
    }

    .main-container {
      position: relative;
      z-index: 1;

      min-height: calc(100vh - 80px);

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      padding: 3rem 1rem;
    }

    .success-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;

      letter-spacing: 2px;

      margin-bottom: 2rem;

      background: linear-gradient(
        135deg,
        #fff 0%,
        var(--gold) 55%,
        #c08020 100%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .ticket {
      width: 100%;
      max-width: 560px;

      background: rgba(255,255,255,0.04);

      border: 1px solid var(--border);

      backdrop-filter: blur(22px);

      border-radius: 14px;

      padding: 2rem;

      position: relative;
      overflow: hidden;

      box-shadow: 0 30px 80px rgba(0,0,0,0.55);

      animation: fadeUp 0.8s ease both;
    }

    .ticket::before {
      content: '';

      position: absolute;
      inset: 0;

      background: linear-gradient(
        135deg,
        transparent,
        rgba(240,192,64,0.04),
        transparent
      );

      pointer-events: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .ticket-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .ticket-header h3 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-weight: 900;
      letter-spacing: 2px;
    }

    #moviePoster {
      width: 100%;
      border-radius: 10px;

      margin-bottom: 1.5rem;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.5),
        0 0 25px rgba(240,192,64,0.12);
    }

    .ticket-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;

      padding: 0.9rem 0;

      border-bottom: 1px solid var(--border);
    }

    .ticket-row:last-child {
      border-bottom: none;
    }

    .ticket-row strong {
      color: var(--gold);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .ticket-row span {
      text-align: right;
      color: #fff;
    }

    .qr-section {
      text-align: center;
      margin-top: 2rem;
    }

    #ticketQR {
      background: #fff;

      padding: 10px;

      border-radius: 10px;

      box-shadow:
        0 0 30px rgba(240,192,64,0.2),
        0 15px 40px rgba(0,0,0,0.4);
    }

    .qr-note {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .thank-you {
      margin-top: 1.5rem;

      text-align: center;

      color: var(--gold);

      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .btn-area {
      margin-top: 2rem;

      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .premium-btn {
      padding: 0.95rem 1.8rem;

      border: none;
      border-radius: 4px;

      background: linear-gradient(
        135deg,
        var(--crimson),
        #8b1a1a
      );

      color: #fff;

      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;

      transition: all 0.3s ease;

      text-decoration: none;

      position: relative;
      overflow: hidden;
    }

    .premium-btn::after {
      content: '';

      position: absolute;
      inset: 0;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.15),
        transparent
      );

      transform: translateX(-100%);
      transition: transform 0.45s;
    }

    .premium-btn:hover::after {
      transform: translateX(100%);
    }

    .premium-btn:hover {
      transform: translateY(-4px) scale(1.03);

      box-shadow: 0 10px 28px var(--crimson-glow);

      color: #fff;
    }

    /* MODAL */

    .email-modal {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,0.7);

      backdrop-filter: blur(8px);

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 9999;
    }

    .email-modal-content {
      width: 90%;
      max-width: 420px;

      background: rgba(15,15,20,0.95);

      border: 1px solid var(--border);

      border-radius: 14px;

      padding: 2rem;

      box-shadow: 0 20px 60px rgba(0,0,0,0.7);

      text-align: center;
    }

    .email-modal-content h4 {
      color: var(--gold);
      margin-bottom: 1rem;
      font-family: 'Cinzel', serif;
    }

    .email-modal-content input {
      width: 100%;

      background: rgba(255,255,255,0.05);

      border: 1px solid var(--border);

      color: #fff;

      padding: 0.9rem 1rem;

      border-radius: 6px;

      outline: none;
    }

    .email-modal-content input:focus {
      border-color: var(--gold);
    }

    .modal-buttons {
      margin-top: 1.5rem;

      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .toast-box {
      position: fixed;

      bottom: 2rem;
      left: 50%;

      transform: translateX(-50%) translateY(20px);

      background: rgba(10,10,20,0.95);

      border: 1px solid rgba(255,255,255,0.08);

      color: #fff;

      padding: 0.95rem 1.8rem;

      border-radius: 6px;

      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;

      backdrop-filter: blur(16px);

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;

      z-index: 99999;

      text-align: center;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-success {
      border-color: rgba(46,204,113,0.4);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(46,204,113,0.25);
    }

    .toast-error {
      border-color: rgba(192,57,43,0.5);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(192,57,43,0.35);
    }

    @media (max-width: 576px) {

      .ticket {
        padding: 1.3rem;
      }

      .ticket-row {
        flex-direction: column;
      }

      .ticket-row span {
        text-align: left;
      }

      .btn-area {
        flex-direction: column;
      }

      .premium-btn {
        width: 100%;
      }

      .toast-box {
        width: 90%;
        font-size: 0.7rem;
      }
    }

  </style>
</head>

<body>

<div class="toast-box" id="toast"></div>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      bOOk<span class="brand-dot">·</span>Picturr
    </a>
  </div>
</nav>

<div class="main-container">

  <h2 class="success-title">
    Booking Successful!
  </h2>

  <div id="ticketArea" class="ticket">

    <div class="ticket-header">
      <h3>Premium Cinema Ticket</h3>
    </div>

    <img id="moviePoster" src="" alt="Movie Poster">

    <div class="ticket-row">
      <strong>🎬 Movie</strong>
      <span id="movie"></span>
    </div>

    <div class="ticket-row">
      <strong>🏢 Theatre</strong>
      <span id="theatre"></span>
    </div>

    <div class="ticket-row">
      <strong>💺 Seats</strong>
      <span id="seats"></span>
    </div>

    <div class="ticket-row">
      <strong>📅 Date</strong>
      <span id="date"></span>
    </div>

    <div class="ticket-row">
      <strong>⏰ Showtime</strong>
      <span id="time"></span>
    </div>

    <div class="ticket-row">
      <strong>💰 Amount Paid</strong>
      <span>₹<span id="amount"></span></span>
    </div>

    <div class="qr-section">

      <img id="ticketQR" src="" alt="Ticket QR" width="200" height="200">

      <p class="qr-note">
        Show this QR at theatre entrance
      </p>

    </div>

    <div class="thank-you">
      Thank you for booking with bOOk Picturr 🍿
    </div>

  </div>

  <div class="btn-area">

    <button id="sendEmailBtn" class="premium-btn">
      Send Ticket Email
    </button>

    <a href="index.html" class="premium-btn">
      Back To Home
    </a>

  </div>

</div>

<!-- EMAIL MODAL -->

<div id="emailModal" class="email-modal">

  <div class="email-modal-content">

    <h4>Send Ticket</h4>

    <input
      type="email"
      id="modalEmail"
      placeholder="Enter your email"
    />

    <div class="modal-buttons">

      <button id="modalSendBtn" class="premium-btn">
        Send
      </button>

      <button id="modalCancelBtn" class="premium-btn">
        Cancel
      </button>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3.2.0/dist/email.min.js"></script>

<script>

  emailjs.init("40yZeRBtJNJtJvhIb");

  const movie =
    localStorage.getItem("movieName") || "N/A";

  const theatre =
    localStorage.getItem("theatre") || "N/A";

  const date =
    localStorage.getItem("date") || "N/A";

  const time =
    localStorage.getItem("time") || "N/A";

  const seats =
    localStorage.getItem("seats") || "N/A";

  const amount =
    localStorage.getItem("totalPrice") || "0";

  const movieImage =
    localStorage.getItem("movieImage") ||
    "https://via.placeholder.com/400x200";

  document.getElementById("movie").innerText = movie;
  document.getElementById("theatre").innerText = theatre;
  document.getElementById("date").innerText = date;
  document.getElementById("time").innerText = time;
  document.getElementById("seats").innerText = seats;
  document.getElementById("amount").innerText = amount;
  document.getElementById("moviePoster").src = movieImage;

  const ticketData =
    `Movie: ${movie}
Theatre: ${theatre}
Date: ${date}
Time: ${time}
Seats: ${seats}
Amount: ₹${amount}`;

  const qrImg = document.getElementById("ticketQR");

  qrImg.src =
    `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(ticketData)}`;

  // MODAL

  const emailModal =
    document.getElementById("emailModal");

  const sendBtn =
    document.getElementById("sendEmailBtn");

  const cancelBtn =
    document.getElementById("modalCancelBtn");

  const modalSendBtn =
    document.getElementById("modalSendBtn");

  sendBtn.addEventListener("click", () => {
    emailModal.style.display = "flex";
  });

  cancelBtn.addEventListener("click", () => {
    emailModal.style.display = "none";
  });

  // SEND EMAIL

  modalSendBtn.addEventListener("click", () => {

    const email =
      document.getElementById("modalEmail")
      .value
      .trim();

    if (!email) {
      showToast(
        "Please enter a valid email",
        "error"
      );
      return;
    }

    const bookingId = Date.now();

    const templateParams = {
      to_email: email,
      movie: movie,
      theatre: theatre,
      date: date,
      time: time,
      seats: seats,
      price: amount,
      movie_image: movieImage,
      qr_code: qrImg.src,
      booking_id: bookingId
    };

    showToast(
      "Sending ticket...",
      "success"
    );

   console.log(templateParams);

emailjs.send(
  "service_0fktii5",
  "template_rpazhtp",
  templateParams,
  "40yZeRBtJNJtJvhIb"
)

    .then(() => {

      confetti({
        particleCount: 180,
        spread: 90,
        origin: { y: 0.6 }
      });

      showToast(
        "Ticket sent successfully!",
        "success"
      );

      document.getElementById("modalEmail").value = "";

      emailModal.style.display = "none";

    })

    .catch((err) => {

      console.error(err);

      showToast(
        "Failed to send email",
        "error"
      );
    });
  });

  // TOAST

  let toastTimeout;

  function showToast(message, type = "success") {

    const toast =
      document.getElementById("toast");

    toast.textContent = message;

    toast.className = "toast-box";

    if (type === "success") {
      toast.classList.add("toast-success");
    }

    if (type === "error") {
      toast.classList.add("toast-error");
    }

    toast.classList.add("show");

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {

      toast.classList.remove("show");

    }, 2500);
  }

</script>

</body>
</html>
