<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - ShowPay</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --crimson: #c0392b;
      --crimson-glow: rgba(192,57,43,0.5);
      --gold: #f0c040;
      --deep: #07080f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #ddd8cc;
      --muted: rgba(221,216,204,0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--deep);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(192,57,43,0.08), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(240,192,64,0.06), transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(15,20,40,0.95), var(--deep) 100%);
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7,8,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
    }

    .navbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold) !important;
      text-decoration: none;
      text-shadow: 0 0 20px rgba(240,192,64,0.5);
    }

    .brand-dot {
      color: var(--crimson);
    }

    .main-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 1rem;
    }

    .contact-card {
      width: 100%;
      max-width: 560px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      padding: 3rem 2rem;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.9s ease both;
    }

    .contact-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(240,192,64,0.04), transparent);
      pointer-events: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--crimson);
      text-align: center;
      margin-bottom: 0.8rem;
      position: relative;
      z-index: 1;
    }

    .contact-card h2 {
      font-family: 'Cinzel', serif;
      text-align: center;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, var(--gold) 55%, #c08020 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .section-rule {
      width: 55px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 1rem auto 2rem;
      position: relative;
      z-index: 1;
    }

    form {
      position: relative;
      z-index: 2;
    }

    .form-control {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .form-control::placeholder {
      color: var(--muted);
    }

    .form-control:focus {
      background: rgba(255,255,255,0.05);
      color: #fff;
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(240,192,64,0.18);
    }

    textarea.form-control {
      resize: none;
    }

    .send-btn {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.95rem 1.5rem;
      border: none;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--crimson), #8b1a1a);
      color: #fff;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .send-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.45s;
    }

    .send-btn:hover::after {
      transform: translateX(100%);
    }

    .send-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 28px var(--crimson-glow);
    }

    .footer {
      position: relative;
      z-index: 1;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .toast-box {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(10,10,20,0.95);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      padding: 0.95rem 1.8rem;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 99999;
      text-align: center;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-success {
      border-color: rgba(46,204,113,0.4);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(46,204,113,0.25);
    }

    .toast-error {
      border-color: rgba(192,57,43,0.5);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(192,57,43,0.35);
    }

    @media (max-width: 576px) {
      .contact-card {
        padding: 2.2rem 1.2rem;
      }

      .toast-box {
        width: 90%;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>

<div class="toast-box" id="toast"></div>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      Show<span class="brand-dot">·</span>Pay
    </a>
  </div>
</nav>

<div class="main-container">
  <div class="contact-card">

    <p class="eyebrow">✦ We Are Here To Help ✦</p>

    <h2>Contact Us</h2>

    <p class="subtitle">Send your message to ShowPay</p>

    <div class="section-rule"></div>

    <form id="contactForm">
      <input type="text" id="name" class="form-control" placeholder="Your Name" required />
      <input type="email" id="email" class="form-control" placeholder="Your Email" required />
      <input type="text" id="subject" class="form-control" placeholder="Subject" required />
      <textarea id="message" class="form-control" rows="5" placeholder="Message" required></textarea>

      <button type="submit" class="send-btn">
        Send Message
      </button>
    </form>

  </div>
</div>

<div class="footer">
  © 2025 ShowPay · Premium Cinema Experience
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3.2.0/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  emailjs.init("9sTIa1QgxqfcPR6e-");

  document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const sendButton = document.querySelector(".send-btn");

    const templateParams = {
      from_name: document.getElementById("name").value.trim(),
      from_email: document.getElementById("email").value.trim(),
      subject: document.getElementById("subject").value.trim(),
      message: document.getElementById("message").value.trim()
    };

    if (!templateParams.from_name || !templateParams.from_email || !templateParams.subject || !templateParams.message) {
      showToast("Please fill all fields", "error");
      return;
    }

    sendButton.disabled = true;
    sendButton.innerText = "Sending...";

    emailjs.send("service_hb0i6a9", "template_8w5oiwp", templateParams)
      .then(() => {
        confetti({
          particleCount: 180,
          spread: 90,
          origin: { y: 0.6 }
        });

        showToast("Message sent successfully!", "success");
        document.getElementById("contactForm").reset();
      })
      .catch((err) => {
        console.error("Failed to send message:", err);
        showToast("Failed to send message", "error");
      })
      .finally(() => {
        sendButton.disabled = false;
        sendButton.innerText = "Send Message";
      });
  });

  let toastTimeout;

  function showToast(message, type = "success") {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.className = "toast-box";

    if (type === "success") {
      toast.classList.add("toast-success");
    }

    if (type === "error") {
      toast.classList.add("toast-error");
    }

    toast.classList.add("show");

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
