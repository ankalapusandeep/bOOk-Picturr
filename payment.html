<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment - bOOk Picturr</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --crimson: #c0392b;
      --crimson-glow: rgba(192,57,43,0.5);
      --gold: #f0c040;
      --deep: #07080f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #ddd8cc;
      --muted: rgba(221,216,204,0.5);
      --green: #2ecc71;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--deep);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(192,57,43,0.08), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(240,192,64,0.06), transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(15,20,40,0.95), var(--deep) 100%);
    }

    .payment-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .payment-box {
      max-width: 430px;
      width: 100%;
      padding: 3rem 2rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      text-align: center;
      animation: fadeUp 0.9s ease both;
      position: relative;
      overflow: hidden;
    }

    .payment-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(240,192,64,0.04), transparent);
      pointer-events: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .brand {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(240,192,64,0.5);
      margin-bottom: 1.5rem;
    }

    .brand-dot {
      color: var(--crimson);
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 0.8rem;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, var(--gold) 55%, #c08020 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 2;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 2;
    }

    .amount-box {
      position: relative;
      z-index: 2;
      margin: 1.2rem auto;
      padding: 0.9rem 1rem;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .qr-box {
      position: relative;
      z-index: 2;
      margin: 1.6rem auto;
      padding: 0.9rem;
      background: #fff;
      border-radius: 10px;
      width: fit-content;
      box-shadow:
        0 0 30px rgba(240,192,64,0.25),
        0 15px 40px rgba(0,0,0,0.5);
    }

    .qr-box img {
      display: block;
      border-radius: 6px;
    }

    .note {
      position: relative;
      z-index: 2;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }

    .success-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: 1rem;
      padding: 0.95rem 1.5rem;
      border: none;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--crimson), #8b1a1a);
      color: #fff;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .success-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.45s;
    }

    .success-btn:hover::after {
      transform: translateX(100%);
    }

    .success-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 28px var(--crimson-glow);
    }

    .toast-box {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(10,10,20,0.95);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      padding: 0.95rem 1.8rem;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      backdrop-filter: blur(16px);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(192,57,43,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 9999;
      text-align: center;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-success {
      border-color: rgba(46,204,113,0.4);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(46,204,113,0.25);
    }

    @media (max-width: 576px) {
      .payment-box {
        padding: 2.2rem 1.2rem;
      }

      .toast-box {
        width: 90%;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>

<div class="toast-box" id="toast"></div>

<div class="payment-page">
  <div class="payment-box">

    <div class="brand">
      bOOk<span class="brand-dot">·</span>Picturr
    </div>

    <p class="eyebrow">✦ Secure UPI Payment ✦</p>

    <h3 class="main-title">Complete Payment</h3>

    <p class="subtitle">Scan QR code using any UPI app</p>

    <div class="amount-box">
      Amount: ₹<span id="payAmount">0</span>
    </div>

    <div class="qr-box">
      <img id="payQR" src="" alt="Payment QR" width="220" height="220" />
    </div>

    <p class="note">Google Pay · PhonePe · Paytm · BHIM supported</p>

    <button id="confirmBtn" class="success-btn">
      Payment Successful
    </button>

  </div>
</div>

<script>
  const amount = localStorage.getItem("totalPrice") || "0";
  const movie = localStorage.getItem("movieName") || "Ticket";

  document.getElementById("payAmount").innerText = amount;

  const upiString = `upi://pay?pa=7989291892@jio&pn=bOOk%20Picturr&am=${amount}&cu=INR&tn=${encodeURIComponent(movie + " Ticket")}`;

  document.getElementById("payQR").src =
    `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiString)}`;

  document.getElementById("confirmBtn").addEventListener("click", () => {
    showToast("Payment verified successfully!", "success");

    setTimeout(() => {
      window.location.href = "scratchcard.html";
    }, 900);
  });

  let toastTimeout;

  function showToast(message, type = "success") {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.className = "toast-box";

    if (type === "success") {
      toast.classList.add("toast-success");
    }

    toast.classList.add("show");

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
