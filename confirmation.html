<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Confirm Booking - bOOk Picturr</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --crimson: #c0392b;
      --crimson-glow: rgba(192,57,43,0.5);
      --gold: #f0c040;
      --deep: #07080f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #ddd8cc;
      --muted: rgba(221,216,204,0.5);
      --green: #2ecc71;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--deep);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(192,57,43,0.08), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(240,192,64,0.06), transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(15,20,40,0.95), var(--deep) 100%);
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7,8,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      animation: slideDown 0.7s ease both;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-100%);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .navbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold) !important;
      text-shadow: 0 0 20px rgba(240,192,64,0.5);
      text-decoration: none;
    }

    .navbar-brand:hover {
      text-shadow: 0 0 40px rgba(240,192,64,0.9);
    }

    .brand-dot {
      color: var(--crimson);
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      padding: 3rem 1rem 5rem;
    }

    .back-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 0.55rem 1.2rem;
      border-radius: 3px;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: var(--crimson);
      border-color: var(--crimson);
      color: #fff;
      box-shadow: 0 0 18px var(--crimson-glow);
      transform: translateX(-4px);
    }

    .confirm-container {
      max-width: 680px;
      margin: 3rem auto 0;
      padding: 3rem 2rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      animation: fadeUp 0.9s ease both;
      position: relative;
      overflow: hidden;
    }

    .confirm-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(240,192,64,0.04), transparent);
      pointer-events: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 0.8rem;
      text-align: center;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, var(--gold) 55%, #c08020 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .section-rule {
      width: 55px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 1rem auto 2rem;
    }

    .booking-card {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.6rem;
    }

    .booking-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 0.95rem;
    }

    .booking-row:last-child {
      border-bottom: none;
    }

    .booking-row strong {
      color: var(--gold);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .booking-row span {
      text-align: right;
      color: #fff;
    }

    .proceed-btn {
      width: 100%;
      margin-top: 1.8rem;
      padding: 0.95rem 2.5rem;
      border: none;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--crimson), #8b1a1a);
      color: #fff;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .proceed-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.45s;
    }

    .proceed-btn:hover::after {
      transform: translateX(100%);
    }

    .proceed-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 28px var(--crimson-glow);
    }

    .toast-box {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(10,10,20,0.95);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      padding: 0.95rem 1.8rem;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      backdrop-filter: blur(16px);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(192,57,43,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
      z-index: 9999;
      text-align: center;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-success {
      border-color: rgba(46,204,113,0.4);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(46,204,113,0.25);
    }

    .toast-warning {
      border-color: rgba(240,192,64,0.5);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.6),
        0 0 25px rgba(240,192,64,0.35);
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 576px) {
      .confirm-container {
        padding: 2rem 1rem;
      }

      .booking-row {
        flex-direction: column;
      }

      .booking-row span {
        text-align: left;
      }

      .toast-box {
        width: 90%;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>

<div class="toast-box" id="toast"></div>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      bOOk<span class="brand-dot">·</span>Picturr
    </a>
  </div>
</nav>

<div class="page-wrap">

  <div class="container" id="backBtnContainer" style="display:none;">
    <button class="back-btn" onclick="history.back()">← Back</button>
  </div>

  <div class="confirm-container">

    <p class="eyebrow">✦ Premium Cinema Booking ✦</p>

    <h2 class="main-title">Confirm Booking</h2>

    <p class="subtitle">Review your ticket details</p>

    <div class="section-rule"></div>

    <div class="booking-card">
      <div class="booking-row">
        <strong>🎬 Movie</strong>
        <span id="movie">—</span>
      </div>

      <div class="booking-row">
        <strong>🏢 Theatre</strong>
        <span id="theatre">—</span>
      </div>

      <div class="booking-row">
        <strong>📅 Date</strong>
        <span id="date">—</span>
      </div>

      <div class="booking-row">
        <strong>⏰ Showtime</strong>
        <span id="time">—</span>
      </div>

      <div class="booking-row">
        <strong>💺 Seats</strong>
        <span id="seats">—</span>
      </div>

      <div class="booking-row">
        <strong>💰 Amount</strong>
        <span>₹<span id="amount">—</span></span>
      </div>

      <button onclick="proceedToPayment()" class="proceed-btn">
        Proceed To Payment
      </button>
    </div>

  </div>
</div>

<footer>
  © 2025 bOOk Picturr · Premium Cinema Experience
</footer>

<script>
  if (!window.location.pathname.endsWith("index.html")) {
    document.getElementById("backBtnContainer").style.display = "block";
  }

  const movie = localStorage.getItem("movieName") || "Not Selected";
  const theatre = localStorage.getItem("theatre") || "Not Selected";
  const date = localStorage.getItem("date") || "Not Selected";
  const time = localStorage.getItem("time") || "Not Selected";
  const seats = localStorage.getItem("seats") || "Not Selected";
  const amount = localStorage.getItem("totalPrice") || "0";

  document.getElementById("movie").innerText = movie;
  document.getElementById("theatre").innerText = theatre;
  document.getElementById("date").innerText = date;
  document.getElementById("time").innerText = time;
  document.getElementById("seats").innerText = seats;
  document.getElementById("amount").innerText = amount;

  function proceedToPayment() {
    showToast("Redirecting to payment...", "success");

    setTimeout(() => {
      window.location.href = "payment.html";
    }, 900);
  }

  let toastTimeout;

  function showToast(message, type = "success") {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.className = "toast-box";

    if (type === "success") {
      toast.classList.add("toast-success");
    }

    if (type === "warning") {
      toast.classList.add("toast-warning");
    }

    toast.classList.add("show");

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
