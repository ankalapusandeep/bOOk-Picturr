<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Select Seats - ShowPay</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    :root {
      --crimson: #c0392b;
      --gold: #f0c040;
      --deep: #07080f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #ddd8cc;
      --muted: rgba(221,216,204,0.5);
      --green: #2ecc71;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--deep);
      font-family: 'Outfit', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(192,57,43,0.08), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(240,192,64,0.06), transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(15,20,40,0.95), var(--deep) 100%);
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(7,8,15,0.9);

      backdrop-filter: blur(20px);

      border-bottom: 1px solid var(--border);

      padding: 0.9rem 1.5rem;
    }

    .navbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 3px;

      color: var(--gold) !important;

      text-decoration: none;
    }

    .brand-dot {
      color: var(--crimson);
    }

    .main-container {
      position: relative;
      z-index: 1;

      padding: 4rem 1rem;
    }

    .booking-box {
      max-width: 800px;

      margin: auto;

      background: rgba(255,255,255,0.04);

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 3rem 2rem;

      backdrop-filter: blur(22px);

      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    }

    .main-title {
      font-family: 'Cinzel', serif;

      text-align: center;

      font-size: clamp(2rem, 5vw, 3rem);

      font-weight: 900;

      letter-spacing: 2px;

      margin-bottom: 1rem;

      background: linear-gradient(
        135deg,
        #fff 0%,
        var(--gold) 55%,
        #c08020 100%
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;

      color: var(--muted);

      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 2rem;
    }

    #seatsContainer {
      text-align: center;
      margin-top: 2rem;
    }

    .seat {
      width: 42px;
      height: 42px;

      margin: 6px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 5px;

      background: var(--surface);

      border: 1px solid var(--border);

      color: var(--text);

      cursor: pointer;

      transition: all 0.25s ease;
    }

    .seat:hover {
      background: var(--gold);
      color: #000;
      transform: scale(1.08);
    }

    .seat.selected {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .booking-info {
      text-align: center;
      margin-top: 2rem;
    }

    .booking-info h5 {
      margin-bottom: 1rem;
      color: var(--text);
    }

    .confirm-btn {
      margin-top: 1.5rem;

      padding: 0.95rem 2.5rem;

      border: none;
      border-radius: 4px;

      background: linear-gradient(
        135deg,
        var(--crimson),
        #8b1a1a
      );

      color: #fff;

      font-weight: 600;

      letter-spacing: 2px;
      text-transform: uppercase;

      transition: all 0.3s ease;
    }

    .confirm-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 10px 28px rgba(192,57,43,0.45);
    }

    .toast-box {
      position: fixed;

      bottom: 2rem;
      left: 50%;

      transform: translateX(-50%) translateY(20px);

      background: rgba(10,10,20,0.95);

      border: 1px solid rgba(255,255,255,0.08);

      color: #fff;

      padding: 0.95rem 1.8rem;

      border-radius: 6px;

      font-size: 0.78rem;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;

      z-index: 99999;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 576px) {

      .booking-box {
        padding: 2rem 1rem;
      }

      .seat {
        width: 34px;
        height: 34px;
        margin: 4px;
      }

      .toast-box {
        width: 90%;
        font-size: 0.7rem;
      }
    }

  </style>
</head>

<body>

<div class="toast-box" id="toast"></div>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      Show<span class="brand-dot">·</span>Pay
    </a>
  </div>
</nav>

<div class="main-container">

  <div class="booking-box">

    <h2 class="main-title">
      Select Your Seats
    </h2>

    <p class="subtitle">
      Choose your cinema experience
    </p>

    <div id="seatsContainer"></div>

    <div class="booking-info">

      <h5>
        Selected Seats:
        <span id="count">0</span>
      </h5>

      <h5>
        Total Price:
        ₹<span id="total">0</span>
      </h5>

      <button id="confirmBtn" class="confirm-btn">
        Confirm Booking
      </button>

    </div>

  </div>

</div>

<script>

  const seatsContainer =
    document.getElementById("seatsContainer");

  const count =
    document.getElementById("count");

  const total =
    document.getElementById("total");

  const ticketPrice = 200;

  let selectedSeats = [];

  // Generate Seats

  for (let row = 0; row < 6; row++) {

    for (let col = 1; col <= 10; col++) {

      const seat =
        document.createElement("div");

      seat.classList.add("seat");

      const seatNumber =
        String.fromCharCode(65 + row) + col;

      seat.innerText = seatNumber;

      seat.dataset.seat = seatNumber;

      seat.addEventListener("click", () => {

        seat.classList.toggle("selected");

        updateSeats();
      });

      seatsContainer.appendChild(seat);
    }

    seatsContainer.appendChild(document.createElement("br"));
  }

  // Update

  function updateSeats() {

    const selected =
      document.querySelectorAll(".seat.selected");

    selectedSeats =
      Array.from(selected).map(
        seat => seat.dataset.seat
      );

    count.innerText = selectedSeats.length;

    total.innerText =
      selectedSeats.length * ticketPrice;
  }

  // Confirm

  document
    .querySelector("#confirmBtn")

    .addEventListener("click", () => {

      if (selectedSeats.length === 0) {

        showToast("Please select seats");

        return;
      }

      const totalPrice =
        selectedSeats.length * ticketPrice;

      localStorage.setItem(
        "movieName",
        "Movie 1"
      );

      localStorage.setItem(
        "seats",
        selectedSeats.join(", ")
      );

      localStorage.setItem(
        "seatsCount",
        selectedSeats.length
      );

      localStorage.setItem(
        "totalPrice",
        totalPrice
      );

      showToast("Booking confirmed!");

      setTimeout(() => {

        window.location.href =
          "confirmation.html";

      }, 900);
    });

  // Toast

  let toastTimeout;

  function showToast(message) {

    const toast =
      document.getElementById("toast");

    toast.textContent = message;

    toast.className =
      "toast-box show";

    clearTimeout(toastTimeout);

    toastTimeout =
      setTimeout(() => {

        toast.classList.remove("show");

      }, 2500);
  }

</script>

</body>
</html>
